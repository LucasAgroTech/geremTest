# Configuração para o projeto de matching EMBRAPII

# Configurações do SharePoint
sharepoint:
  site: https://embrapii.sharepoint.com/sites/GEPES
  # email e password serão definidos via .env ou linha de comando
  data_path:
    gerem_interacoes: General/Lucas Pinheiro/scriptGerem/apuracao_resultados_2024.xlsx
    prospeccoes: DWPII/srinfo/prospeccao_prospeccao.xlsx
    negociacoes: DWPII/srinfo/negociacoes_empresas.xlsx
    projetos: DWPII/srinfo/portfolio.xlsx

# Caminhos locais
local_paths:
  data: data
  temp: temp
  results: results
  logs: logs
  evaluation: evaluation
  visualization: visualization

# Configurações de matching
matching:
  # Mapeamento de colunas
  column_mapping:
    gerem:
      id: id_gerem
      empresa: empresa
      nome_capital: empresa_nome_capital
      data: data_interacao
    prospeccoes:
      id: id_prospeccao
      empresa: nome_empresa
      data: data_prospeccao
      cnpj: cnpj_empresa
      unidade: unidade_embrapii
    negociacoes:
      id: codigo_negociacao
      empresa: razao_social
      cnpj: cnpj
      data: data_prim_ver_prop_tec
      unidade: unidade_embrapii
    projetos:
      id: codigo_projeto
      empresa: nome_empresa
      data: data_inicio
      unidade: unidade_embrapii
  
  # Configurações dos algoritmos
  algorithms:
    levenshtein:
      enabled: true
      threshold: 0.7
    jaro_winkler:
      enabled: true
      threshold: 0.8
    embedding:
      enabled: true
      threshold: 0.6
      model: paraphrase-multilingual-MiniLM-L12-v2
  
  # Faixas de thresholds para testes
  threshold_test:
    levenshtein: [0.5, 0.6, 0.7, 0.8, 0.9]
    jaro_winkler: [0.7, 0.75, 0.8, 0.85, 0.9]
    embedding: [0.5, 0.6, 0.7, 0.8, 0.9]

# Configurações de avaliação
evaluation:
  metrics: [precision, recall, f1, agreement]
  generate_visualizations: true
  save_detailed_results: true
  best_algorithm_criteria: match_count  # Critério para selecionar o melhor algoritmo

# Configurações de visualização
visualization:
  figsize: [12, 8]
  palette: viridis
  dpi: 300

# Configurações de log
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: matching.log
  console: true