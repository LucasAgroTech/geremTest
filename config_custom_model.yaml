# Configuração para usar o modelo personalizado treinado
# Modelo treinado com acurácia de 99.50% e F1-Score de 99.25%

sharepoint:
  site: https://embrapii.sharepoint.com/sites/GEPES
  data_path:
    gerem_interacoes: General/Lucas Pinheiro/scriptGerem/apuracao_resultados_2024.xlsx
    prospeccoes: DWPII/srinfo/prospeccao_prospeccao.xlsx
    negociacoes: DWPII/srinfo/negociacoes_empresas.xlsx
    negociacoes_negociacoes: DWPII/srinfo/negociacoes_negociacoes.xlsx
    info_empresas: DWPII/srinfo/info_empresas.xlsx
    projetos: DWPII/srinfo/portfolio.xlsx

local_paths:
  data: data
  temp: temp
  results: results
  logs: logs
  evaluation: evaluation
  visualization: visualization

matching:
  column_mapping:
    gerem:
      id: id_prospeccao
      empresa: nome_empresa
      nome_capital: nome_empresa
      data: data_interacao
    prospeccoes:
      id: id_prospeccao
      empresa: nome_empresa
      data: data_prospeccao
      cnpj: cnpj_empresa
      unidade: unidade_embrapii
    negociacoes:
      id: codigo_negociacao
      empresa: razao_social
      cnpj: cnpj
      data: data_prim_ver_prop_tec
      unidade: unidade_embrapii
    negociacoes_negociacoes:
      id: codigo_negociacao
      data: data_prim_ver_prop_tec
    info_empresas:
      cnpj: cnpj
      razao_social: razao_social
    projetos:
      id: codigo_projeto
      empresa: info_empresa
      data: data_inicio
      unidade: unidade_embrapii
  
  # 🎯 CONFIGURAÇÃO PARA MODELO PERSONALIZADO TREINADO
  algorithms:
    levenshtein:
      enabled: false  # Desabilitado para focar no modelo treinado
      threshold: 0.7
    jaro_winkler:
      enabled: false  # Desabilitado para focar no modelo treinado
      threshold: 0.8
    embedding:
      enabled: false  # Desabilitado para usar o modelo personalizado
      threshold: 0.6
      model: paraphrase-multilingual-MiniLM-L12-v2
    custom_trained:
      enabled: true   # 🔥 MODELO PERSONALIZADO HABILITADO
      threshold: 0.75 # Threshold otimizado para o modelo treinado
      model_path: company_matching_trainer/models/manual_validated_matcher
      batch_size: 32
      max_length: 128
  
  threshold_test:
    custom_trained: [0.7, 0.75, 0.8, 0.85, 0.9]

evaluation:
  metrics: [precision, recall, f1, agreement]
  generate_visualizations: true
  save_detailed_results: true
  best_algorithm_criteria: match_count
  run_threshold_comparison: false  # Desabilitado para performance

# Configurações de visualização
visualization:
  figsize: [12, 8]
  palette: viridis
  dpi: 300

# Configurações de logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: matching_custom_model.log
  console: true
