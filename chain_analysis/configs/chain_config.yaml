default_algorithms:
  negociacoes: levenshtein
  projetos: levenshtein
  prospecoes: levenshtein
default_thresholds:
  negociacoes: 0.7
  projetos: 0.7
  prospecoes: 0.7
export:
  format: excel
  include_charts: true
  include_raw_data: true
paths:
  chain_results: chain_analysis/analysis_results
  charts: chain_analysis/analysis_results/charts
  exports: chain_analysis/analysis_results/exports
  reports: chain_analysis/analysis_results/reports
  results_base: results
performance:
  batch_size_analysis: 1000
  enable_parallel_processing: false
  max_matches_for_visualization: 10000
sensitivity_ranges:
  negociacoes:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  projetos:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  prospecoes:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
statistical_analysis:
  bootstrap_samples: 1000
  confidence_level: 0.95
  min_sample_size: 30
visualization:
  color_palette: viridis
  dpi: 300
  figure_size:
  - 12
  - 8
  theme: plotly
